---
layout: null
---
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEO 透镜搜索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* 布局：居中单焦点。首页只有一个搜索框；结果页为 680px 正文栏 + 320px 来源栏，底部悬浮居中输入框；过程页为左侧步骤轨 + 中间演示 + 右侧讲解 */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{
  --bg:#fcfcfd; --panel:#ffffff; --fg:#0e1014; --fg2:#4b515a; --fg3:#8b919a; --fg4:#b4b9c0;
  --line:rgba(16,24,40,.08); --line2:rgba(16,24,40,.14); --soft:#f3f4f6; --soft2:#eaecef;
  --accent:#2d5bff; --accent-ink:#ffffff; --accent-tint:rgba(45,91,255,.09); --accent-ring:rgba(45,91,255,.22);
  --hl:rgba(45,91,255,.10);
  --good:#0f7a3d; --good-tint:rgba(15,122,61,.10); --bad:#c0392b; --bad-tint:rgba(192,57,43,.09);
  --s0:#a0a6ae; --s1:#2d5bff; --s2:#0a9aa6; --s3:#d48a00; --s4:#7a4fe0; --s5:#d43f86;
  --g1:#4a7bf2; --g2:#17a596; --g3:#e5a412; --g4:#8d6cec; --g5:#ea6a52; --g6:#62a446;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 24px -6px rgba(16,24,40,.10);
  --shadow-lg:0 2px 4px rgba(16,24,40,.04),0 24px 64px -12px rgba(16,24,40,.22);
  --glass:rgba(252,252,253,.78);
  --ui:"Geist","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:linear(0,.06 2%,.23 5%,.5 9%,.78 14%,.95 19%,1.03 24%,1.05 29%,1.04 35%,1.01 45%,.995 60%,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0c0e; --panel:#121316; --fg:#ececee; --fg2:#a3a8b0; --fg3:#6d727b; --fg4:#4a4e55;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13); --soft:#17181b; --soft2:#1f2125;
  --accent:#7f9bff; --accent-ink:#0b0c0e; --accent-tint:rgba(127,155,255,.12); --accent-ring:rgba(127,155,255,.3);
  --hl:rgba(127,155,255,.14);
  --good:#6fd394; --good-tint:rgba(111,211,148,.12); --bad:#f2998b; --bad-tint:rgba(242,153,139,.12);
  --s0:#6d727b; --s1:#7f9bff; --s2:#47c7cf; --s3:#f0b43a; --s4:#a98bf6; --s5:#f07fb3;
  --g1:#7aa2f5; --g2:#45c2b2; --g3:#f1bf45; --g4:#ab93f5; --g5:#f28f79; --g6:#8cc66c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -6px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 28px 70px -12px rgba(0,0,0,.7);
  --glass:rgba(11,12,14,.72);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0c0e; --panel:#121316; --fg:#ececee; --fg2:#a3a8b0; --fg3:#6d727b; --fg4:#4a4e55;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13); --soft:#17181b; --soft2:#1f2125;
  --accent:#7f9bff; --accent-ink:#0b0c0e; --accent-tint:rgba(127,155,255,.12); --accent-ring:rgba(127,155,255,.3);
  --hl:rgba(127,155,255,.14);
  --good:#6fd394; --good-tint:rgba(111,211,148,.12); --bad:#f2998b; --bad-tint:rgba(242,153,139,.12);
  --s0:#6d727b; --s1:#7f9bff; --s2:#47c7cf; --s3:#f0b43a; --s4:#a98bf6; --s5:#f07fb3;
  --g1:#7aa2f5; --g2:#45c2b2; --g3:#f1bf45; --g4:#ab93f5; --g5:#f28f79; --g6:#8cc66c;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px -6px rgba(0,0,0,.5);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 28px 70px -12px rgba(0,0,0,.7);
  --glass:rgba(11,12,14,.72);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"ss01","cv11";text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent-ring)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.press{transition:transform .18s var(--ease),background .18s,color .18s,box-shadow .18s}
.press:active{transform:scale(.96)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--panel);color:var(--fg3);box-shadow:0 1px 0 var(--line2)}

/* ---------- 顶栏 ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:1px solid transparent;transition:border-color .3s;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top.scrolled{border-bottom-color:var(--line)}
.top-in{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:56px;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:-.01em;justify-self:start;white-space:nowrap}
.brand-mark{width:24px;height:24px;border-radius:7px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.brand-mark svg{width:14px;height:14px}
.brand small{font-weight:500;color:var(--fg3);font-size:12px;padding:2px 7px;border-radius:6px;background:var(--soft)}
.seg-ctl{position:relative;display:flex;padding:3px;border-radius:10px;background:var(--soft);visibility:hidden}
.has-ds .seg-ctl{visibility:visible}
.seg-ctl button{position:relative;z-index:1;padding:5px 14px;font-size:13px;font-weight:500;color:var(--fg3);border-radius:7px;transition:color .2s;white-space:nowrap}
.seg-ctl button.on{color:var(--fg)}
.seg-ctl .thumb{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--panel);box-shadow:var(--shadow-sm),0 0 0 1px var(--line);transition:left .35s var(--ease),width .35s var(--ease);transition:left .5s var(--spring),width .5s var(--spring)}
.top-r{display:flex;align-items:center;gap:6px;justify-self:end}
.xswitch{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--fg2)}
.xswitch:hover{background:var(--soft)}
.sw{width:30px;height:18px;border-radius:18px;background:var(--soft2);box-shadow:inset 0 0 0 1px var(--line2);position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .45s var(--ease);transition:transform .5s var(--spring)}
.xon .sw{background:var(--accent);box-shadow:none}
.xon .sw::after{transform:translateX(12px)}
.iconbtn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--fg2)}
.iconbtn:hover{background:var(--soft);color:var(--fg)}
.iconbtn svg{width:16px;height:16px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- 搜索框 ---------- */
.box{position:relative;width:100%;border-radius:18px;background:var(--panel);box-shadow:0 0 0 1px var(--line2),var(--shadow);padding:14px 12px 10px 18px;transition:box-shadow .3s var(--ease)}
.box:focus-within{box-shadow:0 0 0 1px var(--accent),0 0 0 4px var(--accent-ring),var(--shadow)}
.box::before{content:"";position:absolute;inset:-1px;border-radius:19px;padding:1.5px;background:conic-gradient(from var(--ang),transparent 0 62%,var(--accent) 78%,transparent 92%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}
.box.busy::before{opacity:1;animation:rot 1.4s linear infinite}
@keyframes rot{to{--ang:360deg}}
.box textarea{display:block;width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--fg);font:inherit;font-size:15px;line-height:1.55;height:24px;max-height:140px;padding:0}
.box textarea::placeholder{color:var(--fg3)}
.box-row{display:flex;align-items:center;gap:6px;margin-top:12px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;font-weight:500;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2)}
.chipbtn:hover{background:var(--soft)}
.chipbtn svg{width:14px;height:14px}
.xon .chipbtn.xchip{color:var(--accent);background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.box-row .sp{flex:1}
.hintk{font-size:12px;color:var(--fg3);display:flex;gap:6px;align-items:center;margin-right:6px}
.send{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft2);color:var(--fg3);transition:background .2s,color .2s,transform .18s var(--ease)}
.send svg{width:16px;height:16px}
.box.ready .send{background:var(--fg);color:var(--bg)}
.send:active{transform:scale(.9)}

/* ---------- 首页 ---------- */
#home{min-height:calc(100% - 56px);display:flex;flex-direction:column;justify-content:center;padding-block:48px 12vh}
.home-in{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--fg2);padding:4px 12px 4px 6px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line2);margin-bottom:22px}
.eyebrow i{font-style:normal;font-size:11px;font-weight:600;color:var(--accent-ink);background:var(--accent);padding:1px 7px;border-radius:999px}
.greet{font-size:clamp(26px,4vw,34px);font-weight:500;letter-spacing:-.035em;line-height:1.15;text-align:center;text-wrap:balance;margin:0 0 10px}
.greet-sub{margin:0 0 30px;color:var(--fg3);font-size:14px;text-align:center;text-wrap:balance}
.sugg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:18px}
.sugg button{height:32px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--fg2);box-shadow:inset 0 0 0 1px var(--line2);background:var(--panel);display:inline-flex;align-items:center;gap:7px}
.sugg button:hover{color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg4);transform:translateY(-1px)}
.sugg svg{width:13px;height:13px;color:var(--fg3)}
.flow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 4px;margin-top:56px;font-size:12px;color:var(--fg3)}
.flow span{display:inline-flex;align-items:center;gap:6px;padding:3px 4px}
.flow span b{font-family:var(--mono);font-weight:500;font-size:10.5px;color:var(--fg4)}
.flow i{font-style:normal;color:var(--fg4);font-size:11px}
.xon .flow span{color:var(--fg2)}
.xon .flow span b{color:var(--accent)}
.home-in>*{animation:rise .8s var(--ease) both}
.home-in>*:nth-child(2){animation-delay:.05s}.home-in>*:nth-child(3){animation-delay:.1s}.home-in>*:nth-child(4){animation-delay:.16s}.home-in>*:nth-child(5){animation-delay:.22s}.home-in>*:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ---------- 结果页 ---------- */
#results{padding-block:28px 180px}
.res{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,680px) minmax(0,320px);gap:64px;justify-content:center}
.col-a{min-width:0;position:relative}
.qtitle{font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.3;margin:0 0 18px;text-wrap:balance}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--fg2);font-size:12.5px;margin-bottom:18px;line-height:1.6}
.banner svg{flex:none;width:15px;height:15px;margin-top:2px;color:var(--accent)}
.think{margin-bottom:22px;font-size:13px;color:var(--fg2)}
.think-h{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px 0 8px;margin-left:-8px;border-radius:8px}
button.think-h:hover{background:var(--soft)}
.think-h svg.car{width:14px;height:14px;transition:transform .3s var(--ease);color:var(--fg3)}
.think.open .think-h svg.car{transform:rotate(180deg)}
.think-h .ok{width:16px;height:16px;border-radius:50%;background:var(--good-tint);color:var(--good);display:grid;place-items:center}
.think-h .ok svg{width:10px;height:10px}
.shimmer{background:linear-gradient(90deg,var(--fg3) 0%,var(--fg3) 35%,var(--fg) 50%,var(--fg3) 65%,var(--fg3) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.8s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
.think-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.think.open .think-body,.think.running .think-body{grid-template-rows:1fr}
.think-body>div{overflow:hidden}
.tlist{position:relative;margin:8px 0 2px 7px;padding-left:20px;border-left:1px solid var(--line2)}
.tstep{position:relative;padding:4px 0;opacity:0;transform:translateY(4px);transition:opacity .35s,transform .35s var(--ease)}
.tstep.show{opacity:1;transform:none}
.tstep::before{content:"";position:absolute;left:-24.5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1.5px var(--fg4)}
.tstep.done::before{background:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
.tstep.cur::before{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px var(--accent-tint),0 0 0 1.5px var(--accent)}}
.tstep .more{color:var(--accent);font-size:12px;margin-left:8px;opacity:0;transition:opacity .2s}
.think.open .tstep:hover .more{opacity:1}
.sq{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}
.sq span{font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--fg2)}

.legend{display:none;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--fg2);padding:9px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:20px}
.xon .legend{display:flex}
.legend .lt{color:var(--fg3)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:14px;height:8px;border-radius:2px;display:inline-block}

.answer{font-size:15px;line-height:1.78;color:var(--fg);letter-spacing:.005em}
.answer p{margin:0 0 14px}
.answer h3{font-size:16.5px;line-height:1.45;letter-spacing:-.015em;margin:28px 0 8px;font-weight:600;text-wrap:balance}
.answer ul{margin:0 0 14px;padding-left:18px}
.answer li{margin:0 0 8px;padding-left:4px}
.answer li::marker{color:var(--fg4)}
.answer b{font-weight:600}
.rv{animation:reveal .7s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes reveal{from{opacity:0;filter:blur(6px);transform:translateY(3px)}to{opacity:1;filter:none;transform:none}}
.seg{border-radius:3px;transition:background .25s,opacity .25s,box-shadow .25s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.seg.hl{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.ktag{display:none}
.cite{display:inline-flex;align-items:center;gap:4px;vertical-align:1px;margin-left:5px;height:19px;padding:0 7px 0 2px;border-radius:999px;background:var(--soft);font-size:11px;line-height:1;color:var(--fg2);white-space:nowrap;font-weight:500}
.cite:hover{background:var(--soft2);color:var(--fg)}
.ico{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:4px;font-size:8.5px;font-weight:700;color:#fff;flex:none;font-style:normal;line-height:1}
.cite .ico{border-radius:50%}

.xon .answer .seg{background:color-mix(in srgb,var(--sc) 11%,transparent);box-shadow:inset 0 -1.5px 0 color-mix(in srgb,var(--sc) 65%,transparent);cursor:pointer}
.xon .answer .seg.k-synth{background:transparent;box-shadow:none;border-bottom:1px dashed var(--s0);border-radius:0}
.xon .answer .seg:hover,.xon .answer .seg.pin{background:color-mix(in srgb,var(--sc) 22%,transparent)}
.xon .answer .ktag{display:inline-block;font-style:normal;font-size:10px;line-height:1;padding:3px 5px;border-radius:4px;margin-left:4px;vertical-align:2px;background:color-mix(in srgb,var(--sc) 16%,var(--panel));color:var(--fg2);font-weight:500}
.xon .answer .k-synth .ktag{background:var(--soft)}
.answer.dim .seg{opacity:.25}
.answer.dim .seg.lit{opacity:1}

/* 溯源弹层 */
.pop{position:absolute;z-index:25;width:min(400px,100%);border-radius:14px;background:var(--panel);box-shadow:0 0 0 1px var(--line2),var(--shadow-lg);padding:14px 16px;transform-origin:var(--ox,24px) top;animation:popin .35s var(--ease) both;animation:popin .5s var(--spring) both}
@keyframes popin{from{opacity:0;transform:scale(.94) translateY(-4px)}to{opacity:1;transform:none}}
.pop-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--fg3)}
.pop-h .x{margin-left:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--fg3)}
.pop-h .x:hover{background:var(--soft);color:var(--fg)}
.kbadge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-tint);color:var(--accent)}
.pop .desc{font-size:12.5px;color:var(--fg2);margin:0 0 10px;line-height:1.6}
.tsrc{position:relative;padding:8px 10px 8px 12px;margin:0 0 6px;border-radius:10px;background:var(--soft)}
.tsrc::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--sc)}
.tsrc-h{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.tsrc-h .r{font-family:var(--mono);font-size:11px;color:var(--fg3);font-weight:400}
.tsrc-h .scorev{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:500}
.tsrc blockquote{margin:4px 0 0;font-size:12.5px;color:var(--fg2);line-height:1.65}

.pipe{margin:30px 0 0;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:14px}
.pipe-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 12px;font-size:13px}
.pipe-h b{font-weight:600}
.linkbtn{color:var(--accent);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.linkbtn svg{width:13px;height:13px;transition:transform .25s var(--ease)}
.linkbtn:hover svg{transform:translateX(3px)}
.pipe-steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pstep{text-align:left;padding:9px 10px;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;gap:1px;min-width:0}
.pstep:hover{background:var(--soft2);transform:translateY(-1px)}
.pstep small{font-size:10.5px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pstep strong{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:-.02em}
.pstep span{font-size:11px;color:var(--fg2);line-height:1.35}

/* 悬浮输入框 */

/* 侧栏 */

@keyframes flash{0%,100%{background:transparent}25%{background:var(--accent-tint)}}

.gap{font-family:var(--mono);font-size:11px;color:var(--bad);white-space:nowrap}
.miss p{margin:3px 0 0;color:var(--fg2);line-height:1.55}

/* ---------- 过程页 ---------- */
#process{padding-block:24px 80px}
.proc{max-width:1320px;margin:0 auto}

.back{color:var(--fg3);font-size:12.5px;font-weight:500;display:inline-flex;gap:4px;align-items:center;margin-bottom:10px;height:26px;padding:0 8px 0 4px;margin-left:-4px;border-radius:7px}

.st .num{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:11px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line2);color:var(--fg3);transition:all .3s var(--ease);overflow:hidden}
.st .num svg{width:24px;height:24px;position:absolute;inset:0;transform:rotate(-90deg)}
.st .num circle{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:69.1;stroke-dashoffset:69.1}
.st.on .num circle.run{animation:ring var(--dur,9s) linear forwards}
@keyframes ring{to{stroke-dashoffset:0}}
.st b{display:block;font-size:13px;font-weight:500;color:var(--fg2)}
.st small{display:block;font-family:var(--mono);font-size:10px;color:var(--fg4);letter-spacing:.06em}
.st.past .num{background:var(--accent-tint);color:var(--accent);box-shadow:none}
.st.on .num{background:var(--fg);color:var(--bg);box-shadow:0 0 0 4px var(--soft2)}

.panel{min-width:0}
.panel h2{margin:0 0 6px;font-size:20px;font-weight:600;letter-spacing:-.025em;line-height:1.35;text-wrap:balance}
.panel .lead{margin:0 0 22px;color:var(--fg2);font-size:13.5px;line-height:1.7}
.notes{position:sticky;top:80px;display:flex;flex-direction:column;gap:22px;min-width:0}
.note h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;color:var(--fg3);font-weight:600;text-transform:uppercase}
.note p{margin:0;font-size:13px;line-height:1.75;color:var(--fg2)}
.note ol{margin:0;padding:0;list-style:none;counter-reset:g;display:flex;flex-direction:column;gap:8px}
.note ol li{counter-increment:g;position:relative;font-size:13px;line-height:1.65;padding:10px 12px 10px 34px;border-radius:10px;background:var(--accent-tint);color:var(--fg)}
.note ol li::before{content:counter(g);position:absolute;left:12px;top:11px;font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:500}
.terms{display:flex;flex-direction:column;gap:8px}
.term{font-size:12.5px;line-height:1.6;color:var(--fg2);padding-bottom:8px;border-bottom:1px solid var(--line)}
.term:last-child{border-bottom:0}
.term b{display:block;color:var(--fg);font-weight:600;font-size:12.5px}
.pager{display:flex;justify-content:space-between;margin-top:36px;gap:12px;padding-top:20px;border-top:1px solid var(--line)}
.pager button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line2);min-width:160px}
.pager button small{font-size:11px;color:var(--fg3)}

.pager button.nx{align-items:flex-end;margin-left:auto}
.pager button:hover{background:var(--soft)}
.pager button:disabled{visibility:hidden}
.stage-in>*{animation:rise .6s var(--ease) both}
.stage-in>*:nth-child(2){animation-delay:.04s}.stage-in>*:nth-child(3){animation-delay:.08s}.stage-in>*:nth-child(4){animation-delay:.12s}.stage-in>*:nth-child(5){animation-delay:.16s}.stage-in>*:nth-child(n+6){animation-delay:.2s}
.subh{font-size:12px;font-weight:600;margin:0 0 10px;color:var(--fg2);letter-spacing:.02em}
.surface{border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:16px}

/* 阶段 1 */
.u-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line);margin-bottom:28px}

.u-card dt{color:var(--fg3)}
.u-card dd{margin:0}
.fan{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:0}
.fan-q{padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:500;font-size:13.5px;white-space:nowrap;z-index:1}

/* 阶段 2 */
.r-row{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr) 44px;gap:14px;align-items:center;padding:7px 0;font-size:12.5px}

.sum{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;margin:22px 0 28px;padding:14px 16px;border-radius:12px;background:var(--soft);font-size:12.5px;color:var(--fg2)}
.sum b{font-size:22px;font-family:var(--mono);font-weight:500;color:var(--fg);letter-spacing:-.03em}
.sum i{font-style:normal;color:var(--fg4)}
.sum em{font-style:normal;flex-basis:100%;font-size:12px;color:var(--fg3)}
.lost{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lost div{border-radius:12px;padding:12px;font-size:12.5px;color:var(--fg2);line-height:1.6;background-image:repeating-linear-gradient(135deg,transparent 0 6px,var(--soft) 6px 7px);box-shadow:inset 0 0 0 1px var(--line)}

/* 阶段 3 */
.funnel{display:flex;flex-direction:column;gap:4px;margin-bottom:26px}
.fn{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;font-size:12px;color:var(--fg3)}
.fn div{height:24px;border-radius:6px;background:var(--accent-tint);display:flex;align-items:center;padding:0 10px;font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap;min-width:max-content;transform-origin:left;animation:grow .9s var(--ease) both}
.fn:last-child div{background:var(--accent);color:var(--accent-ink)}
@keyframes grow{from{transform:scaleX(.2);opacity:0}}
.lab{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.lab-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--soft)}
.lab-h b{font-size:12.5px;font-weight:600}
.presets{display:flex;padding:2px;border-radius:9px;background:var(--soft2);gap:2px;flex-wrap:wrap}
.presets button{height:26px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:500;color:var(--fg2)}
.presets button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow-sm),0 0 0 1px var(--line)}
.hint{font-size:12.5px;color:var(--fg2);margin:0;padding:10px 14px;border-bottom:1px solid var(--line);line-height:1.65}
.hint b{color:var(--accent);font-weight:600}
.weights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 22px;padding:16px 14px;border-bottom:1px solid var(--line)}
.wt label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;gap:8px;margin-bottom:6px}
.wt label i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:7px}
.wt label .v{font-family:var(--mono);font-weight:400;color:var(--fg3);font-size:11px}
.wt p{margin:5px 0 0;font-size:11px;color:var(--fg3);line-height:1.45}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--c,var(--accent)) var(--p),var(--soft2) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--c,var(--accent)) var(--p),var(--soft2) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.18);transition:transform .2s var(--ease)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.18)}

.board{position:relative;margin:8px}
.brow{position:absolute;left:0;right:0;height:48px;display:grid;grid-template-columns:22px minmax(0,190px) minmax(0,1fr) 44px 56px;gap:12px;align-items:center;padding:0 8px;border-radius:10px;transition:transform .5s var(--ease),background .2s;transition:transform .7s var(--spring),background .2s}
.brow:hover{background:var(--soft)}

.brow .nm{display:flex;align-items:center;gap:8px;min-width:0}
.brow .nm div{min-width:0}
.brow .nm b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .nm small{display:block;font-size:11px;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .stack{margin:0;height:8px;border-radius:3px}
.brow .scorev{font-size:13px;text-align:right}
.stat{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.badge{font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;white-space:nowrap}
.badge.in{background:var(--good-tint);color:var(--good)}
.badge.out{background:var(--soft2);color:var(--fg3)}
.delta{font-family:var(--mono);font-size:10px;width:18px;text-align:center}
.delta.up{color:var(--good)} .delta.dn{color:var(--bad)}
.cutline{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);pointer-events:none;opacity:.7}
.cutline span{position:absolute;left:50%;transform:translate(-50%,-50%);top:0;font-size:10.5px;font-weight:600;background:var(--bg);color:var(--bad);padding:0 8px;letter-spacing:.04em}

/* 阶段 4 */
.cmeta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--fg3);margin:0 0 14px}
.cmeta b{font-family:var(--mono);color:var(--fg);font-weight:500}
.doc{border-radius:14px;box-shadow:0 0 0 1px var(--line2),var(--shadow);overflow:hidden;background:var(--panel)}
.doc-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--soft)}
.doc-bar .dots{display:flex;gap:5px}
.doc-bar .dots i{width:9px;height:9px;border-radius:50%;background:var(--soft2);box-shadow:inset 0 0 0 1px var(--line2)}
.doc-bar .u{flex:1;min-width:0;max-width:320px;margin:0 auto;padding:3px 10px;border-radius:7px;background:var(--panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:11px;color:var(--fg3);text-align:center}
.doc-body{padding:16px}
.doc-title{font-size:16px;font-weight:600;margin:0 0 12px;letter-spacing:-.015em}
.chunk{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:16px;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:4px;transition:background .3s,box-shadow .3s;animation:rise .5s var(--ease) both}
.chunk p{margin:0;font-size:13px;line-height:1.7}
.chunk .cs{font-size:11px;color:var(--fg3)}
.chunk .cs .bar{height:3px;border-radius:2px;background:var(--soft2);margin:4px 0;overflow:hidden}
.chunk .cs .bar i{display:block;height:100%;background:var(--fg4);transform-origin:left;animation:grow 1s var(--ease) both}
.chunk .cs b{font-family:var(--mono);font-size:12.5px;color:var(--fg);font-weight:500}
.chunk.pick{background:var(--accent-tint);box-shadow:inset 0 0 0 1px var(--accent-ring)}
.chunk.pick .cs .bar i{background:var(--accent)}
.chunk.drop p{color:var(--fg3)}
.ctag{display:block;margin-top:1px;font-weight:500;color:var(--accent)}
.chunk.drop .ctag{color:var(--fg3);font-weight:400}

/* 阶段 5 */
.comp{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:4px 0 10px;gap:2px}
.comp i{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}

.map{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,210px);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:start;font-size:13px;animation:rise .5s var(--ease) both}
.mrow:first-child{border-top:0}
.mrow>*{grid-row:1}
.mrow .ix{grid-column:1;font-family:var(--mono);color:var(--fg4);font-size:11px;padding-top:2px}
.mrow .tx{grid-column:2;min-width:0;line-height:1.65}
.mrow .fr{grid-column:3;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.tagk{white-space:nowrap;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:5px;background:var(--soft);color:var(--fg3)}
.tagk.extract{background:var(--accent-tint);color:var(--accent)}
.tagk.merge{background:color-mix(in srgb,var(--g4) 14%,transparent);color:var(--g4)}
.chip-s{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px 2px 2px;border-radius:999px;background:color-mix(in srgb,var(--sc) 12%,var(--panel))}

/* 阶段 6 */
.cgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:28px}
.ccard{border-radius:12px;padding:12px;background:color-mix(in srgb,var(--sc) 7%,var(--panel));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 26%,transparent);display:flex;flex-direction:column;gap:6px;min-width:0;animation:rise .5s var(--ease) both}

  'RAG':'检索增强生成：先检索资料，再让模型基于资料写回答。',

  init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){this.on=false}}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()},
  tone(f,{t=0,d=.08,g=.05,type='sine',f2=null,a=.004}={}){
    const c=this.ctx,o=c.createOscillator(),v=c.createGain(),s=c.currentTime+t;

  },

    const now=performance.now();if(k==='tick'&&now-this.last<28)return;this.last=now;

    return `<h2>先读懂问题，再拆成子问题</h2><p class="lead">用户输入的只是一句话，AI 会先补全它的意图和隐含条件。</p>
    <div class="u-grid">
      <div class="u-card"><small>意图类型</small><div class="big">${esc(it.type)}</div></div>
      <div class="u-card"><small>识别出的实体</small><div class="chips">${it.ents.map(e=>`<span>${esc(e)}</span>`).join('')}</div></div>
      <div class="u-card"><small>补全的隐含条件</small><dl>${it.cons.map(c=>`<dt>${esc(c[0])}</dt><dd>${esc(c[1])}</dd>`).join('')}</dl></div>
      <div class="u-card"><small>回答规划</small><div style="font-size:13px;line-height:1.7">${esc(it.plan)}</div></div>
    </div>
    <p class="subh">查询扇出 · 1 个问题 → ${ds.subs.length} 个子问题</p>
    <div class="fan" id="fan"><svg class="wires" id="wires"></svg><div class="fan-q" id="fanq">${esc(state.q||ds.query)}</div>
      <ul class="fan-list">${ds.subs.map((s,i)=>`<li style="animation-delay:${reduced?0:200+i*90}ms"><span>Q${i+1}</span>${esc(s[0])}</li>`).join('')}</ul></div>`;
  },
  retrieve(ds){
    const max=Math.max(...ds.subs.map(s=>s[1]+s[2]));
    return `<h2>每个子问题各自去搜，结果汇入候选池</h2><p class="lead">深色是关键词索引的命中数，浅色是向量检索的命中数。</p>
    <div class="r-legend"><span class="lg"><i style="background:var(--g1)"></i>关键词索引</span><span class="lg"><i style="background:color-mix(in srgb,var(--g1) 35%,var(--soft2))"></i>向量检索（语义）</span></div>
    ${ds.subs.map((s,i)=>`<div class="r-row"><span class="q"><span>Q${i+1}</span>${esc(s[0])}</span>
      <div class="bar"><i data-w="${s[1]/max*100}" style="background:var(--g1);transition-delay:${i*70}ms"></i><i data-w="${s[2]/max*100}" style="background:color-mix(in srgb,var(--g1) 35%,var(--soft2));transition-delay:${i*70+120}ms"></i></div><span class="n mono">${s[1]+s[2]}</span></div>`).join('')}
    <div class="sum"><span>原始结果</span><b data-count="${ds.total}">0</b><i>→</i><span>去重后候选池</span><b data-count="${ds.dedup}">0</b><em>同一网页被多个子问题命中时只保留一份，并记下命中次数。</em></div>
    <p class="subh">这些内容连候选池都进不去</p>
    <div class="lost"><div><b>未被收录的页面</b>robots 屏蔽、没有外链、刚发布还没被抓取。</div><div><b>藏在图片和 PDF 里的文字</b>海报、长图、扫描件，机器读不到正文。</div><div><b>需要登录才能看的内容</b>会员专区、私域文章、App 内页。</div></div>`;
  },
  rank(ds){
    const fun=[['召回结果',ds.total],['去重后候选',ds.dedup],['粗排保留',ds.coarse],['进入精排',ds.sources.length],['获得引用',CITE_N]];
    return `<h2>多维打分，按权重加总</h2><p class="lead">拖动权重滑块，排名会实时重排。虚线以上的 ${CITE_N} 个来源会被引用。</p>
    <div class="funnel">${fun.map((f,i)=>`<div class="fn"><span>${f[0]}</span><div style="width:${Math.max(8,Math.sqrt(f[1]/ds.total)*100)}%;animation-delay:${i*80}ms">${fmt(f[1])}</div></div>`).join('')}</div>
    <div class="lab">
      <div class="lab-h"><b>权重实验台</b><div class="presets" id="presets">${PRESETS.map((p,i)=>`<button data-p="${i}" data-sound="tap">${p.n}</button>`).join('')}</div></div>
      <p class="hint">${ds.rankHint}</p>
      <div class="weights">${SIG.map((g,i)=>`<div class="wt"><label for="w-${g.k}"><span><i style="background:var(--g${i+1})"></i>${g.n}</span><span class="v" id="wv-${g.k}"></span></label>
        <input type="range" id="w-${g.k}" min="0" max="50" step="5" value="${state.w[g.k]}" style="--c:var(--g${i+1})"><p>${g.d}</p></div>`).join('')}</div>
      <div class="board" id="board"></div>
    </div>`;
  },
  chunk(ds){
    const s=ds.byId[ds.chunkDoc];
    return `<h2>AI 读的是段落</h2><p class="lead">以入选来源「${esc(s.site)}」为例，看它的页面被切成几段、哪几段被选中。</p>
    <div class="cmeta"><span>匹配子问题 <b style="font-family:var(--ui)">${esc(ds.chunkQ)}</b></span><span>切分 <b>${ds.chunks.length}</b> 段</span><span>选中 <b>${ds.picked}</b> 段</span><span>阈值 <b>0.80</b></span></div>
    <div class="doc"><div class="doc-bar"><span class="dots"><i></i><i></i><i></i></span><span class="u">${esc(s.url)}</span></div>
    <div class="doc-body"><p class="doc-title">${esc(s.title.replace(/ - .*$/,''))}</p>
    ${ds.chunks.map((c,i)=>{const pk=c[1]>=.8;return `<div class="chunk ${pk?'pick':'drop'}" style="animation-delay:${i*80}ms"><p><span class="mono" style="font-size:10.5px;color:var(--fg4);margin-right:8px">§${i+1}</span>${esc(c[0])}</p>
      <div class="cs">匹配度 <b>${c[1].toFixed(2)}</b><div class="bar"><i style="width:${c[1]*100}%;animation-delay:${200+i*80}ms"></i></div><span class="ctag">${pk?'→ 进入上下文':esc(c[2])}</span></div></div>`}).join('')}
    </div></div>`;
  },
  generate(ds){
    const cnt={extract:0,merge:0,synth:0};ds.sents.forEach(s=>cnt[kind(s)]++);
    const n=ds.sents.length;
    const col={extract:'var(--accent)',merge:'var(--g4)',synth:'var(--s0)'};
    return `<h2>把段落写成回答</h2><p class="lead">回答共 ${n} 句。每一句都能追溯到它依据的来源，或者标明由模型自己组织。</p>
    <div class="comp">${Object.keys(cnt).map((k,i)=>`<i style="width:${cnt[k]/n*100}%;background:${col[k]};animation-delay:${i*120}ms"></i>`).join('')}</div>
    <div class="comp-l">${Object.keys(cnt).map(k=>`<span class="lg"><i style="background:${col[k]}"></i>${KLABEL[k]} <b>${cnt[k]}</b></span>`).join('')}</div>
    <div class="map">${ds.sents.map(sg=>{const k=kind(sg);return `<div class="mrow" style="animation-delay:${Math.min(sg.i*45,500)}ms"><span class="ix">${String(sg.i+1).padStart(2,'0')}</span>
      <span class="tx">${sg.b?`<b>${esc(sg.b)}</b>`:''}${esc(sg.x)}</span>
      <span class="fr"><span class="tagk ${k}">${KLABEL[k]}</span>${(sg.f||[]).map(f=>{const s=ds.byId[f.id];return `<span class="chip-s" style="--sc:var(--s${ds.color[f.id]})">${ico(s)}${esc(short(s))}</span>`}).join('')}</span></div>`}).join('')}</div>`;
  },
  cite(ds){
    const cut=ds.rank[CITE_N-1].v;
    const uses=id=>ds.sents.filter(s=>(s.f||[]).some(f=>f.id===id)).length;
    const checks=STAGES.slice(0,5).map(s=>[s.n,s.g[0]]).concat([['引用展示','让第三方替你说话：测评、问答、行业媒体里的客观描述，同样能把品牌带进回答。']]);
    return `<h2>${CITE_N} 个来源获得引用，其余落选</h2><p class="lead">入选来源会出现在回答右侧和句末引用标记里。本次分数线 <span class="mono">${f1(cut)}</span>。</p>
    <div class="cgrid">${ds.cited.map((id,i)=>{const s=ds.byId[id];return `<div class="ccard" style="--sc:var(--s${ds.color[id]});animation-delay:${i*70}ms"><div class="h">${ico(s)}<span>${esc(short(s))}</span><span class="scorev">${f1(s.v0)}</span></div><p>支撑 <b>${uses(id)}</b> 句。${esc(s.why)}</p></div>`}).join('')}</div>
    <p class="subh">落选来源 · 原因与优化方向</p>
    ${ds.rank.slice(CITE_N).map((r,i)=>`<div class="mcard" style="animation-delay:${300+i*70}ms"><div class="h">${ico(r.s)}<b>${esc(r.s.site)}</b><span class="meta">${esc(r.s.type)} · ${esc(r.s.date)}</span><span class="gap">${f1(r.v)} · 差 ${f1(cut-r.v)}</span></div>
      <div><small>落选原因</small><p>${esc(r.s.miss)}</p></div><div class="fix"><small>如果想入选</small><p>${esc(r.s.fix)}</p></div></div>`).join('')}
    <p class="subh" style="margin-top:28px">GEO 内容自查清单 · 勾选你已经做到的</p>
    <div class="check">${checks.map((c,i)=>`<label for="ck-${i}"><input type="checkbox" id="ck-${i}" data-sound="none"><span><b>${c[0]}</b>${c[1]}</span></label>`).join('')}</div>`;
  }
};
function countUp(el){const to=+el.dataset.count,t0=performance.now(),D=reduced?1:900;const f=t=>{const p=Math.min(1,(t-t0)/D),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(to*e));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const STAGE_AFTER={
  understand(){
    requestAnimationFrame(()=>{
      const fan=$('#fan'),svg=$('#wires'),q=$('#fanq');if(!fan||innerWidth<=640)return;
      const fr=fan.getBoundingClientRect(),qr=q.getBoundingClientRect();
      const x0=qr.right-fr.left,y0=qr.top+qr.height/2-fr.top;
      svg.innerHTML=$$('.fan-list li',fan).map((li,i)=>{const r=li.getBoundingClientRect();const x1=r.left-fr.left,y1=r.top+r.height/2-fr.top,mx=(x0+x1)/2;return `<path d="M${x0} ${y0} C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}" style="animation-delay:${i*90}ms"/>`}).join('');
    });
  },
  retrieve(){
    requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.r-row .bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
    $$('[data-count]').forEach(countUp);
  },
  rank(ds){
    const board=$('#board');const narrow=innerWidth<=640;const H=narrow?58:48;
    board.style.height=(ds.sources.length*H)+'px';
    board.innerHTML=ds.sources.map(s=>`<div class="brow" data-id="${s.id}"><span class="rk"></span>
      <div class="nm">${ico(s)}<div><b>${esc(s.site)}</b><small>${esc(s.type)} · ${esc(s.date)}</small></div></div>
      <div class="stack">${SIG.map((g,j)=>`<i style="background:var(--g${j+1})"></i>`).join('')}</div>
      <span class="scorev"></span><span class="stat"><span class="delta"></span><span class="badge"></span></span></div>`).join('')+`<div class="cutline" style="top:${CITE_N*H}px"><span>引用名额线</span></div>`;
    let prevTop=null;
    const update=(first)=>{
      const w=state.w,sw=SIG.reduce((a,g)=>a+w[g.k],0);
      SIG.forEach(g=>{$('#wv-'+g.k).textContent=`${w[g.k]} · ${sw?Math.round(w[g.k]/sw*100):0}%`;const inp=$('#w-'+g.k);inp.value=w[g.k];inp.style.setProperty('--p',(w[g.k]/50*100)+'%')});
      const r=rankBy(ds,w);
      const top=r.slice(0,CITE_N).map(x=>x.s.id).join();
      if(!first&&prevTop!==null&&top!==prevTop)Sound.play('toggle');
      prevTop=top;
      r.forEach((x,i)=>{
        const el=$(`.brow[data-id="${x.s.id}"]`,board);
        el.style.transform=`translateY(${i*H}px)`;
        $('.rk',el).textContent=i+1;
        $$('.stack i',el).forEach((b,j)=>b.style.width=(sw?w[SIG[j].k]*x.s.sig[j]/sw:0)+'%');
        $('.scorev',el).textContent=f1(x.v);
        const b=$('.badge',el);b.className='badge '+(i<CITE_N?'in':'out');b.textContent=i<CITE_N?'入选':'落选';
        const d=x.s.r0-i,dl=$('.delta',el);dl.className='delta '+(d>0?'up':d<0?'dn':'');dl.textContent=d>0?`↑${d}`:d<0?`↓${-d}`:'';
      });
      $$('#presets button').forEach((b,i)=>b.classList.toggle('on',SIG.every(g=>PRESETS[i].w[g.k]===w[g.k])));
    };
    SIG.forEach(g=>$('#w-'+g.k).addEventListener('input',e=>{state.w[g.k]=+e.target.value;Sound.play('tick');update()}));
    $$('#presets button').forEach(b=>b.onclick=()=>{state.w={...PRESETS[+b.dataset.p].w};update()});
    update(true);
  },
  cite(){$$('.check input').forEach(c=>c.onchange=()=>{Sound.play(c.checked?'toggle':'off');const n=$$('.check input:checked').length;if(n===6)toast('6 项全部做到，内容已具备被引用的基础')})}
};

/* ================= 全局事件 ================= */
$$('.xswitch,.xchip').forEach(b=>b.onclick=e=>{e.stopPropagation();setXray(!state.xray)});
$('#soundbtn').onclick=()=>{setSound(!Sound.on);if(Sound.on)Sound.play('toggle');toast(Sound.on?'音效已开启':'音效已关闭')};
$('#go-home').onclick=()=>{vt(()=>setView('home'));Sound.play('page');setTimeout(()=>$('#q-home').focus(),50)};
$('#tab-ai').onclick=()=>{if(state.view==='process')backToResults()};
$('#tab-lens').onclick=()=>{if(state.view!=='process')openProcess(state.stage)};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.sound==='none'||b.closest('#sugg'))return;Sound.play(b.dataset.sound||'tap')},true);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();const ta=state.view==='home'?$('#q-home'):$('#q-res');if(state.view==='process')backToResults();setTimeout(()=>$('#'+(state.view==='home'?'q-home':'q-res')).focus(),60);Sound.play('open');return}
  if(e.key==='Escape'){closePop();return}
  if(state.view==='process'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==='ArrowRight')goStage(state.stage+1);if(e.key==='ArrowLeft')goStage(state.stage-1)}
});
addEventListener('scroll',()=>$('#top').classList.toggle('scrolled',scrollY>4),{passive:true});
addEventListener('resize',()=>{moveThumb();closePop()});
let initX=false,initS=true;try{initX=localStorage.getItem('geo-xray')==='1';initS=localStorage.getItem('geo-sound')!=='0'}catch(e){}
setSound(initS);setXray(initX,true);moveThumb();
if(document.fonts)document.fonts.ready.then(moveThumb);
const h=location.hash.slice(1);
if(h==='results'||h==='process'){search(DATA[0].query,DATA[0].id);if(h==='process')openProcess(0)}
</script>
